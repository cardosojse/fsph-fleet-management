# Isolated Render service: supply these values through its environment.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# PgBouncer for application traffic; direct connection for Flyway.
# Use Java's trust store and verify the server certificate and hostname.
spring.datasource.url=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&channelBinding=require
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.flyway.url=jdbc:postgresql://${NEON_HOST_UNPOOLED}:5432/${NEON_DATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&channelBinding=require
spring.flyway.user=${NEON_USER}
spring.flyway.password=${NEON_PASSWORD}
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# An exact, confirmed frontend origin is required in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
